# Seconds without connectivity before the provisioning AP appears.
# Short when the device has never been configured, longer once a Wi-Fi
# profile exists so transient outages don't flap the AP.
UNPROVISIONED_DELAY=UNPROVISIONED_DELAY_PLACEHOLDER
PROVISIONED_DELAY=PROVISIONED_DELAY_PLACEHOLDER
# Minimum uptime before the offline clock may start at all, so slow DHCP
# during first boot can't trigger the AP while an uplink is still coming up.
BOOT_GRACE=60
