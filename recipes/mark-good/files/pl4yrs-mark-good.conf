# pl4yrs mark-good configuration (sourced by /usr/local/sbin/pl4yrs-mark-good.sh).
#
# Kill-switch: create the VETO_FILE below on the shared FAT config partition —
# readable without booting the device from another machine, or on-device via
# /run/rugix/mounts/config after "mount -o remount,rw /run/rugix/mounts/config".

HEALTH_URL="http://127.0.0.1:4243/health"
SERVICES="pl4yrs-backend.service sendspin-cli.service"
POLL_INTERVAL=15
DEADLINE=300
VETO_FILE="pl4yrs/no-mark-good"
