################
# General Configuration
################

set -g default-terminal "screen-256color"

# Count windows and panes starting from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

set -g mode-keys vi

# Make C-Arrow work in bash
set-window-option -g xterm-keys on

################
# Bind commands
################

# Same prefix as screen : C-a
unbind C-b
set -g prefix ^a
#set -g prefix ^`
bind a send-prefix
#bind ` send-prefix

# Reload tmux conf
bind r source-file ~/.tmux.conf \; display "Tmux confuguration reloaded!"

# Split windows vertically and horizontally
bind | split-window -h
bind - split-window -v


################
# Statusbar configuration
################

# Clock
setw -g clock-mode-colour colour39
setw -g clock-mode-style 24

# Monitor Activity
setw -g monitor-activity on
set -g visual-activity on

# Layout
set -g status-justify centre
set -g status-left-length 40
set -g status-left "[#[fg=green]Session: #S #[fg=yellow] Window: #I #[fg=cyan] Pane: #P]"

# Main Colors
set -g status-fg white
set -g status-bg black

################
# Copy Mode
################

unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

set-option -sg escape-time 10
